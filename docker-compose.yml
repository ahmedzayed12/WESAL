# نشر كامل على خادم واحد (VPS) مع HTTPS تلقائي.
# التوسع: زِد APP_REPLICAS، أو انقل Postgres/Redis/التخزين إلى خدمات مُدارة (راجع docs/DEPLOYMENT.md).
name: wesal

x-app-env: &app-env
  NODE_ENV: production
  TRUST_PROXY: "true"
  APP_ORIGIN: https://${APP_DOMAIN}
  COOKIE_SECURE: "true"
  DATABASE_URL: postgres://wesal:${POSTGRES_PASSWORD}@postgres:5432/wesal
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-15}
  REDIS_URL: redis://redis:6379
  STORAGE_DRIVER: s3
  S3_BUCKET: ${S3_BUCKET:-wesal-media}
  S3_REGION: us-east-1
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: https://${MEDIA_DOMAIN}
  S3_FORCE_PATH_STYLE: "true"
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  MAX_IMAGE_MB: ${MAX_IMAGE_MB:-10}
  MAX_VIDEO_MB: ${MAX_VIDEO_MB:-100}

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  migrate:
    build: .
    command: ["node", "src/migrate.js"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    environment: *app-env
    deploy:
      replicas: ${APP_REPLICAS:-2}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    stop_grace_period: 30s

  worker:
    build: .
    command: ["node", "src/worker.js"]
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wesal
      POSTGRES_USER: wesal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres -c max_connections=200 -c shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE:-1536MB} -c work_mem=8MB
      -c random_page_cost=1.1 -c wal_compression=on -c log_min_duration_statement=500
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wesal -d wesal"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "volatile-lru"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: https://${APP_DOMAIN}
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} && mc anonymous set none local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-wesal-media}
    restart: "no"

  # نسخ احتياطي يومي لقاعدة البيانات في ./backups (يُحتفظ بنسخ آخر 14 يومًا)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: [./backups:/backups]
    entrypoint: >
      /bin/sh -c 'while true; do
        pg_dump -h postgres -U wesal -Fc wesal > /backups/wesal-$$(date +%Y%m%d-%H%M).dump;
        find /backups -name "*.dump" -mtime +14 -delete;
        sleep 86400; done'
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pg_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
