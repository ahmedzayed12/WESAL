services:
  - type: web
    name: wesal-staging
    runtime: node
    branch: staging
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: bash deploy/render-start.sh
    healthCheckPath: /readyz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: local
      - key: DATABASE_URL
        fromDatabase:
          name: wesal-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wesal-staging-cache
          property: connectionString
  - type: keyvalue
    name: wesal-staging-cache
    plan: free
    ipAllowList: []

databases:
  - name: wesal-staging-db
    plan: free
    ipAllowList: []
